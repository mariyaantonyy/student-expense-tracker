

    
  
    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
      <form >
<h1>Student Expense Tracker</h1>
<button type="button" id="themeBtn">🌙 Dark Mode</button>
<div class="container">

    

    <form>

        <label for="amount">Amount</label>
        <input type="number" id="amount" placeholder="Enter amount">

        <label for="category">Category</label>
        <select id="category">
            <option>Food</option>
            <option>Travel</option>
            <option>Shopping</option>
            <option>Books</option>
            <option>Others</option>
        </select>

        <label for="date">Date</label>
        <input type="date" id="date">

        <label for="description">Description</label>
        <input type="text" id="description" placeholder="Enter description">

       <button type="button" id="addBtn">Add Expense</button>

    </form>

   <div class="dashboard">

    <div class="card">
        <h3>Total Expenses</h3>
        <h2 id="totalExpense">₹0</h2>
    </div>

    <div class="card">
        <h3>Total Transactions</h3>
        <h2 id="transactionCount">0</h2>
    </div>

    <div class="card">
        <h3>Highest Expense</h3>
        <h2 id="highestExpense">₹0</h2>
    </div>

</div>
<input type="text" id="search" placeholder="Search by category or description">
<label for="filterCategory">Filter by Category</label>

<select id="filterCategory">
    <option value="All">All</option>
    <option value="Food">Food</option>
    <option value="Travel">Travel</option>
    <option value="Shopping">Shopping</option>
    <option value="Books">Books</option>
    <option value="Others">Others</option>
</select>
<label for="sortExpense">Sort By</label>

<select id="sortExpense">
    <option value="default">Default</option>
    <option value="low">Amount: Low to High</option>
    <option value="high">Amount: High to Low</option>
    <option value="new">Newest Date</option>
    <option value="old">Oldest Date</option>
</select>
<h2>Expense Analytics</h2>

<canvas id="expenseChart"></canvas>
    <div id="expense-list">
        No expenses yet.
    </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="script.js"></script>

</body>
</html>
